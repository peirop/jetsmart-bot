name: JetSMART bot

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede demorarse unos minutos)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

concurrency:
  group: jetsmart
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Recuerda el último aviso para no repetir notificaciones
      - uses: actions/cache@v4
        with:
          path: state.json
          key: jb-state-${{ github.run_id }}
          restore-keys: jb-state-

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - run: node bot.js
        env:
          JS_USER: ${{ secrets.JS_USER }}
          JS_PASS: ${{ secrets.JS_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
